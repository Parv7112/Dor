services:
  # Combined Backend + Frontend Service (Recommended)
  - type: web
    name: dor-app
    env: node
    plan: free
    buildCommand: cd frontend && NODE_ENV= npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false  # Set this in Render dashboard - your MongoDB Atlas connection string
      - key: JWT_SECRET
        sync: false  # Set this in Render dashboard - generate a strong random string
      - key: JWT_EXPIRE
        value: 30d

